world: grief-1
timezone: Europe/Moscow
spawn-time: "22:00"
radius-min: -5000
radius-max: 5000
protect-radius: 60

# Через сколько секунд после появления башни главный приз откроется (5 минут)
unlock-seconds: 300
# Через сколько секунд после открытия главного приза ивент исчезнет (20 минут)
end-after-open-seconds: 1200

# За сколько секунд до 22:00 слать оповещения (2ч, 1ч, 30мин, 1мин)
alerts: [7200, 3600, 1800, 60]

schematic: basnea_drakula.schem
# Точка вставки = центр башни на уровне земли. Слой 0 схематики заменяет верхний блок земли.
paste-y-offset: 0
# Запасной вариант, если в схематике нет чёрного шулкера-маркера (смещение от min-угла схематики)
chest-offset:
  x: 0
  y: 1
  z: 0

chest-title: "&f✟ &4&lСокровищница Дракулы &f✟"

# Стражи Дракулы
guards:
  name: "&4&lСтраж Дракулы"
  name-phase2: "&c&lОзлобленный Страж"
  per-floor: 2
  # Слои схематики (считая от нижнего = 0), где стоят полы 4 этажей.
  # Плагин ищет свободное место в пределах floor-search-height блоков над слоем.
  floors: [3, 15, 26, 39]
  floor-search-height: 8
  # Стражи не выходят за границу: башня + border-margin блоков во все стороны
  border-margin: 10
  # Центр башни от юго-западного (min) угла схематики и разброс, в котором стражи ищут место внутри
  tower-center:
    x: 21
    z: 25
  spread:
    x: 3
    z: 3
  ground:             # наземные (незеритовая броня, меч Острота 5 / Fire Aspect 2, тотем)
    health: 80
    damage: 8         # итоговый урон с мечом
    phase2-health: 60 # после срабатывания тотема
    phase2-damage: 10
  flying:             # летающие (над башней)
    count: 4
    height-above: 6
    health: 80
    damage: 8


bossbar:
  idle: "&4✟ &cБашня Дракулы &8» &7пробудится через &f{time} &4✟"
  locked: "&4✟ &cБашня Дракулы &8» &7X: &f{x} &7Y: &f{y} &7Z: &f{z} &8| &7печать падёт через &f{time} &4✟"
  open: "&4✟ &cСокровищница вскрыта &8» &f{x} {y} {z} &8| &7башня рассыплется через &c{time} &4✟"

messages:
  prefix: "&8[&4✟&8] "
  alert-long: "&7Тьма сгущается... Башня Дракулы восстанет через &c{time}&7."
  alert-1min: "&4Меньше минуты. &7Башня Дракулы вот-вот поднимется из праха..."
  spawned:
    - "&8&m                                        "
    - "&4&l✟ БАШНЯ ДРАКУЛЫ ВОССТАЛА ✟"
    - "&7Из земли поднялись чёрные камни, и ночь стала глубже."
    - "&7Координаты: &fX: {x} &8| &fY: {y} &8| &fZ: {z}"
    - "&7Печать на сокровищнице падёт через &c{time}&7."
    - "&8&m                                        "
  unlocked:
    - "&8&m                                        "
    - "&4&l✟ ПЕЧАТЬ СНЯТА ✟"
    - "&7Багровый шулкер открыт. Кровь потечёт за каждую крупицу золота."
    - "&7Башня обратится в пыль через &c{time}&7."
    - "&8&m                                        "
  ended: "&7Башня Дракулы рассыпалась в прах. До следующей ночи..."
  locked-click: "&cПечать ещё держится. &7Осталось &f{time}&7."
  no-event: "&7Башня спит. Дракула ждёт ночи."
  already-running: "&cБашня уже стоит."
  not-running: "&cБашня сейчас не активна."
  no-spawn: "&cНе удалось найти подходящее место."
  reloaded: "&aКонфиг перезагружен."
  guard-enraged: "&4Тотем стража рассыпался в прах... &cСтраж Дракулы пришёл в ярость!"

info-lines:
  - "&8&m                                        "
  - "&4&l✟ БАШНЯ ДРАКУЛЫ ✟"
  - "&7Древний замок восстаёт из праха каждую ночь"
  - "&7в &c{spawn} &7по московскому времени."
  - "&7Внутри ждёт &4сокровищница&7, запечатанная кровью."
  - "&7Печать падает через &c{lock} &7после появления башни."
  - "&7Стражи не пустят чужаков. Не уходи без боя."
  - "&8&m                                        "

info:
  status-idle: "&7Статус: &8спит &7| до пробуждения &f{time}"
  status-locked: "&7Статус: &cпечать держится &7| &fX:{x} Y:{y} Z:{z} &7| &f{time}"
  status-open: "&7Статус: &4сокровищница открыта &7| &fX:{x} Y:{y} Z:{z} &7| &f{time}"
  admin-header: "&4Для проклятых (админов):"
  admin:
    - "&c/dracula start &8- &7поднять башню сейчас"
    - "&c/dracula stop &8- &7обратить башню в прах"
    - "&c/dracula reload &8- &7перезагрузить конфиг"
    - "&c/dracula tp &8- &7телепорт к башне"
